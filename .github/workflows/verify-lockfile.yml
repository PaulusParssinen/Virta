name: Verify workflow lockfile

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-slim
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
    - name: Checkout
      uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - name: Install lockfile tooling
      run: gh extension install github/gh-actions-lock --pin v0.4.1
    - name: Verify locked dependencies
      run: gh actions-lock --verify
